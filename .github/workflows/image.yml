name: Container image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.lock
      - name: Install project for model generation
        run: python -m pip install -e ".[dev]" -c constraints.lock
      - name: Generate deterministic model artifact
        run: python scripts/verify_phase1.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/phase6/Dockerfile
          push: false
          load: true
          tags: creditscorev4:${{ github.sha }}
      - name: Smoke test image
        run: python scripts/verify_container.py --image creditscorev4:${GITHUB_SHA}
      - name: Scan built image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: creditscorev4:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Inspect image digest
        run: docker image inspect creditscorev4:${GITHUB_SHA} --format '{{index .RepoDigests 0}}' || true
