name: CreditScoreV4 ML Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      
      - name: Run unit tests
        run: pytest tests/unit -v --cov=src --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  data-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Great Expectations suite
        run: |
          python -m src.data_validation.great_expectations_suite
      
      - name: Run schema drift detection
        run: |
          python -m src.data_validation.schema_validator

  model-training:
    runs-on: ubuntu-latest
    needs: [test, data-validation]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Start MLflow
        run: |
          docker compose -f docker/docker-compose.yml up -d mlflow postgres
      
      - name: Train model
        run: |
          python -m src.model_training.trainer
      
      - name: Run drift detection
        run: |
          python -m src.drift_detection.psi_calculator
      
      - name: Run fairness audit
        run: |
          python -m src.fairness_monitoring.fairness_metrics
      
      - name: Upload model artifact
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: models/

  integration-test:
    runs-on: ubuntu-latest
    needs: model-training
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      
      - name: Build and test
        run: |
          docker compose -f docker/docker-compose.yml up -d
          sleep 30
          pytest tests/integration -v
          docker compose -f docker/docker-compose.yml down

  deploy-staging:
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v7
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy to ECS staging
        run: |
          aws ecs update-service --cluster creditscorev4-cluster \
            --service creditscorev4-api-staging --force-new-deployment

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Shadow deployment
        run: |
          echo "Starting shadow deployment..."
          # Deploy with 0% traffic, monitor for 14 days
      
      - name: Canary deployment
        run: |
          echo "Starting canary: 10% → 50% → 100%"
          # Gradual traffic shift with automated gates