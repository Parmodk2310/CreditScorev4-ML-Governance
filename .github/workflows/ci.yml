name: Quality and governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Quality gate
        run: make quality
      - name: Cumulative Phase 7 release gate
        run: make phase7-verify

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform init without backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
