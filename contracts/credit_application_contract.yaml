contract:
  name: credit_application_scoring_v1
  version: 1.0.0
  allow_extra_columns: true
  minimum_rows: 100

columns:
  application_id:
    required: true
    type: string
    unique: true
    max_null_rate: 0.0

  age:
    required: true
    type: integer
    min: 21
    max: 70
    max_null_rate: 0.0

  annual_income:
    required: true
    type: number
    min: 16000
    max: 320000
    max_null_rate: 0.0

  employment_length_years:
    required: true
    type: number
    min: 0
    max: 35
    max_null_rate: 0.0

  debt_to_income:
    required: true
    type: number
    min: 0.02
    max: 0.90
    max_null_rate: 0.0

  credit_utilization:
    required: true
    type: number
    min: 0.01
    max: 0.99
    max_null_rate: 0.0

  credit_history_years:
    required: true
    type: number
    min: 0.5
    max: 45
    max_null_rate: 0.0

  delinquencies_2y:
    required: true
    type: integer
    min: 0
    max: 7
    max_null_rate: 0.0

  inquiries_6m:
    required: true
    type: integer
    min: 0
    max: 8
    max_null_rate: 0.0

  open_credit_accounts:
    required: true
    type: integer
    min: 1
    max: 20
    max_null_rate: 0.0

  device_risk_score:
    required: true
    type: number
    min: 0.0
    max: 1.0
    max_null_rate: 0.05

  bank_transaction_risk:
    required: true
    type: number
    min: 0.0
    max: 1.0
    max_null_rate: 0.0

  employment_verification_score:
    required: true
    type: number
    min: 0.0
    max: 1.0
    max_null_rate: 0.0

  region:
    required: true
    type: string
    allowed_values: [north, south, east, west, central]
    max_null_rate: 0.0

  employment_type:
    required: true
    type: string
    allowed_values: [salaried, self_employed, contract, other]
    max_null_rate: 0.0
