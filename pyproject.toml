[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditscorev4-ml-governance"
version = "0.6.0"
description = "Production-style ML incident simulation and governance case study"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Parmod" }
]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "xgboost>=3.0,<4",
    "PyYAML>=6.0,<7",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "great-expectations>=1.23,<2",
    "fairlearn>=0.14,<0.15",
    "shap>=0.52,<0.53",
    "fastapi>=0.140,<0.141",
    "uvicorn>=0.53,<0.54",
    "prometheus-client>=0.26,<0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "black>=24,<27",
    "mypy>=1.13,<2",
    "types-PyYAML>=6.0.12",
    "httpx>=0.28,<1",
]

[project.urls]
Repository = "https://github.com/Parmodk2310/creditscorev4-ml-governance"
Issues = "https://github.com/Parmodk2310/creditscorev4-ml-governance/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["creditscore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
