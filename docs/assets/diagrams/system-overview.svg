<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">CreditScoreV4 ML Governance System Overview</title>
  <desc id="desc">Five-layer architecture showing synthetic scenarios, risk controls, governance, serving and safe release, delivery and operations, and safety boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EA580C"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0F172A}
      .layer{font:700 17px Arial,sans-serif;fill:#0F172A}
      .box-title{font:700 14px Arial,sans-serif;fill:#0F172A}
      .body{font:12px Arial,sans-serif;fill:#334155}
      .phase{font:700 11px Arial,sans-serif;fill:#64748B}
      .small{font:11px Arial,sans-serif;fill:#475569}
      .flow{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#94A3B8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .rollback{fill:none;stroke:#EA580C;stroke-width:2;marker-end:url(#arrow-orange)}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1180" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" class="title">CreditScoreV4 ML Governance — System Overview</text>
  <text x="600" y="66" text-anchor="middle" class="small">Phase numbers map implementation history to the current integrated v1 system.</text>

    <rect x="55" y="90" width="1090" height="160" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="120" class="layer">1. Synthetic scenarios and reference inputs</text>

  <g>
    <rect x="80" y="140" width="190" height="88" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="175" y="165" text-anchor="middle" class="box-title">Vendor A</text>
    <text x="175" y="186" text-anchor="middle" class="body">Healthy reference</text>
    <text x="175" y="210" text-anchor="middle" class="phase">P1</text>

    <rect x="292" y="140" width="190" height="88" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="387" y="165" text-anchor="middle" class="box-title">Vendor B</text>
    <text x="387" y="186" text-anchor="middle" class="body">Data-quality incident</text>
    <text x="387" y="210" text-anchor="middle" class="phase">P1 / P2</text>

    <rect x="504" y="140" width="190" height="88" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="599" y="165" text-anchor="middle" class="box-title">Vendor C</text>
    <text x="599" y="186" text-anchor="middle" class="body">Contract-valid drift</text>
    <text x="599" y="210" text-anchor="middle" class="phase">P3</text>

    <rect x="716" y="140" width="190" height="88" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="811" y="165" text-anchor="middle" class="box-title">Vendor D</text>
    <text x="811" y="186" text-anchor="middle" class="body">Subgroup fairness stress</text>
    <text x="811" y="210" text-anchor="middle" class="phase">P4</text>

    <rect x="928" y="140" width="190" height="88" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="1023" y="165" text-anchor="middle" class="box-title">Vendor E</text>
    <text x="1023" y="186" text-anchor="middle" class="body">Intersectional proxy stress</text>
    <text x="1023" y="210" text-anchor="middle" class="phase">P12</text>
  </g>

    <rect x="95" y="285" width="1010" height="185" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="120" y="316" class="layer">2. Data and model risk controls</text>

  <g>
    <rect x="130" y="340" width="285" height="105" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="272" y="365" text-anchor="middle" class="box-title">DATA QUALITY</text>
    <text x="272" y="387" text-anchor="middle" class="body">Schema + completeness</text>
    <text x="272" y="406" text-anchor="middle" class="body">Block + quarantine</text>
    <text x="272" y="430" text-anchor="middle" class="phase">P2</text>

    <rect x="458" y="340" width="285" height="105" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="600" y="365" text-anchor="middle" class="box-title">DRIFT</text>
    <text x="600" y="387" text-anchor="middle" class="body">Feature + prediction</text>
    <text x="600" y="406" text-anchor="middle" class="body">PSI + KS</text>
    <text x="600" y="430" text-anchor="middle" class="phase">P3</text>

    <rect x="786" y="340" width="285" height="105" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="928" y="365" text-anchor="middle" class="box-title">FAIRNESS + EXPLAINABILITY</text>
    <text x="928" y="387" text-anchor="middle" class="body">Single-axis + intersectional</text>
    <text x="928" y="406" text-anchor="middle" class="body">SHAP-supported investigation</text>
    <text x="928" y="430" text-anchor="middle" class="phase">P4 / P12</text>
  </g>

    <path d="M175 228 V260 H272 V340" class="flow"/>
  <path d="M387 228 V265 H272 V340" class="flow"/>
  <path d="M387 228 V260 H600 V340" class="flow"/>
  <path d="M599 228 V340" class="flow"/>
  <path d="M811 228 V260 H928 V340" class="flow"/>
  <path d="M1023 228 V340" class="flow"/>

    <rect x="145" y="505" width="910" height="175" rx="18" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="170" y="536" class="layer">3. Governance control plane</text>

  <g>
    <rect x="180" y="560" width="250" height="95" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="305" y="585" text-anchor="middle" class="box-title">POLICY ENGINE</text>
    <text x="305" y="607" text-anchor="middle" class="body">Blocking gates</text>
    <text x="305" y="626" text-anchor="middle" class="body">Deterministic decision</text>
    <text x="305" y="646" text-anchor="middle" class="phase">P5</text>

    <rect x="475" y="560" width="250" height="95" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="600" y="585" text-anchor="middle" class="box-title">EVIDENCE INTEGRITY</text>
    <text x="600" y="607" text-anchor="middle" class="body">SHA-256 lineage</text>
    <text x="600" y="626" text-anchor="middle" class="body">Evidence manifest contract</text>
    <text x="600" y="646" text-anchor="middle" class="phase">P5 / P8</text>

    <rect x="770" y="560" width="250" height="95" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="895" y="585" text-anchor="middle" class="box-title">REGISTRY + AUDIT</text>
    <text x="895" y="607" text-anchor="middle" class="body">Legal state transitions</text>
    <text x="895" y="626" text-anchor="middle" class="body">Decision + audit records</text>
    <text x="895" y="646" text-anchor="middle" class="phase">P5</text>
  </g>

  <path d="M272 445 V485 H305 V560" class="flow"/>
  <path d="M600 445 V485 H305 V560" class="flow"/>
  <path d="M928 445 V485 H305 V560" class="flow"/>
  <path d="M430 607 H475" class="flow"/>
  <path d="M725 607 H770" class="flow"/>

    <rect x="110" y="715" width="980" height="205" rx="18" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="135" y="746" class="layer">4. Serving and safe release</text>

  <rect x="395" y="765" width="410" height="52" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="787" text-anchor="middle" class="box-title">FastAPI serving + Prometheus metrics</text>
  <text x="600" y="806" text-anchor="middle" class="phase">health • readiness • prediction • metrics • P6</text>

  <rect x="150" y="842" width="150" height="52" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="225" y="875" text-anchor="middle" class="box-title">STAGING</text>

  <rect x="365" y="842" width="150" height="52" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="875" text-anchor="middle" class="box-title">SHADOW</text>

  <rect x="580" y="842" width="180" height="52" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="865" text-anchor="middle" class="box-title">CANARY</text>
  <text x="670" y="883" text-anchor="middle" class="small">10% → 25% → 50% → 100%</text>

  <rect x="825" y="842" width="180" height="52" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="915" y="875" text-anchor="middle" class="box-title">PRODUCTION</text>

  <rect x="485" y="925" width="230" height="48" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="600" y="955" text-anchor="middle" class="box-title">ROLLBACK → STAGING</text>

  <path d="M895 655 V695 H600 V765" class="flow"/>
  <path d="M600 817 V828 H225 V842" class="flow"/>
  <path d="M300 868 H365" class="flow"/>
  <path d="M515 868 H580" class="flow"/>
  <path d="M760 868 H825" class="flow"/>
  <path d="M440 894 V925 H485" class="rollback"/>
  <path d="M670 894 V925 H715" class="rollback"/>
  <path d="M485 949 H120 V868 H150" class="rollback"/>

    <rect x="70" y="1005" width="1060" height="120" rx="18" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="95" y="1036" class="layer">5. Delivery, monitoring, analysis, and incident evidence</text>

  <g>
    <rect x="95" y="1055" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#EA580C"/>
    <text x="185" y="1076" text-anchor="middle" class="box-title">CI + SECURITY</text>
    <text x="185" y="1095" text-anchor="middle" class="phase">P7</text>

    <rect x="300" y="1055" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#EA580C"/>
    <text x="390" y="1076" text-anchor="middle" class="box-title">GATED AWS PATH</text>
    <text x="390" y="1095" text-anchor="middle" class="phase">P7</text>

    <rect x="505" y="1055" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#EA580C"/>
    <text x="595" y="1076" text-anchor="middle" class="box-title">MONITORING</text>
    <text x="595" y="1095" text-anchor="middle" class="phase">P11</text>

    <rect x="710" y="1055" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#EA580C"/>
    <text x="800" y="1076" text-anchor="middle" class="box-title">IMPACT + RCA</text>
    <text x="800" y="1095" text-anchor="middle" class="phase">P9 / P10</text>

    <rect x="915" y="1055" width="190" height="52" rx="10" fill="#FFFFFF" stroke="#EA580C"/>
    <text x="1010" y="1076" text-anchor="middle" class="box-title">INCIDENT OPS</text>
    <text x="1010" y="1095" text-anchor="middle" class="phase">P13</text>
