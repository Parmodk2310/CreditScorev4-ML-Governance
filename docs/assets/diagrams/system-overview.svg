  <path d="M915 894 V985 H600 V1005" class="flow"/>
  <path d="M600 655 V985 H800 V1055" class="flow"/>
  <path d="M800 1107 H915" class="flow"/>
  <path d="M595 1055 V980 H1080 V392 H1071" class="dash"/>

    <rect x="210" y="1140" width="780" height="30" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
  <text x="600" y="1160" text-anchor="middle" style="font:700 11px Arial,sans-serif;fill:#7F1D1D">Synthetic evidence only • AWS deployment disabled by default • No automatic retraining • No automatic promotion</text>
</svg>