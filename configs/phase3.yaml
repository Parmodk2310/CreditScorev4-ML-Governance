project:
  name: CreditScoreV4 ML Governance
  phase: 3
  random_seed: 31415

scenario:
  name: vendor_c_contract_valid_drift
  source: vendor_c
  input: data/raw/vendor_a/holdout.csv
  output: data/raw/vendor_c/holdout.csv
  reference_source: vendor_a

vendor_c:
  device_risk:
    center: 0.50
    scale: 0.85
    shift: 0.06
    noise_std: 0.015
  credit_utilization:
    shift: 0.05
    noise_std: 0.010
  debt_to_income:
    shift: 0.035
    noise_std: 0.008
  bank_transaction_risk:
    shift: 0.06
    noise_std: 0.012

monitoring:
  features:
    - annual_income
    - employment_length_years
    - debt_to_income
    - credit_utilization
    - credit_history_years
    - device_risk_score
    - bank_transaction_risk
    - employment_verification_score
  control_features:
    - annual_income
    - credit_history_years
  required_critical_features:
    - device_risk_score
    - bank_transaction_risk
  psi:
    bins: 10
    epsilon: 0.000001
    warning: 0.10
    critical: 0.20
  ks:
    warning: 0.05
    critical: 0.10
    alpha: 0.05

prediction:
  approval_threshold: 0.50

paths:
  model: models/baseline/creditscorev4.joblib
  reference_profile: data/reference/phase3/vendor_a_reference_profile.json
  evidence_json: data/evidence/phase3/drift_report.json
  evidence_csv: data/evidence/phase3/feature_drift.csv

acceptance:
  maximum_vendor_c_device_null_rate: 0.05
  maximum_null_rate_delta_vs_reference: 0.001
  minimum_critical_features: 2
  require_overall_status: CRITICAL
  require_prediction_status: WARNING_OR_CRITICAL
